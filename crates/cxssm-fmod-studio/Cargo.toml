[package]
name = "cxssm-fmod-studio"
description = "Liaison minimale (chargée à l'exécution) vers l'API FMOD Studio : banques, évènements, paramètres, sons actifs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libloading = "0.9"
thiserror.workspace = true
log.workspace = true

# Seul crate du projet autorisé à utiliser `unsafe` (FFI vers FMOD).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
